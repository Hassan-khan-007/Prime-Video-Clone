name: Prime Video CI/CD Pipeline

on:
  push:
    branches: [ "main", "master" ]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3

    - name: Build Docker image
      uses: docker/build-push-action@v5
      with:
        context: .
        load: true
        tags: prime-video-app:v1

    - name: Create Kind Cluster
      uses: container-tools/kind-action@v2

    - name: Load image into Kind
      run: |
        kind load docker-image prime-video-app:v1
    - name: Deploy to Kubernetes
      run: |
        kubectl apply -f deployment.yaml
        kubectl apply -f service.yaml
        kubectl apply -f redis-deployment.yaml
        kubectl apply -f redis-service.yaml
        kubectl rollout status deployment/prime-video-deployment --timeout=60s
        kubectl get pods
        kubectl get svc

        # Rollout status check with automatic debugging logs on failure
        if ! kubectl rollout status deployment/prime-video-deployment --timeout=60s; then
          echo "=== ROLLOUT TIMED OUT. FETCHING DEBUG INFO ==="
          kubectl get pods
          echo "=== POD DESCRIPTION ==="
          kubectl describe pod -l app=prime-video
          echo "=== POD LOGS ==="
          kubectl logs -l app=prime-video --tail=50
          exit 1
        fi
        
        kubectl get pods
        kubectl get svc
    
